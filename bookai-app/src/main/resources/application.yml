anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:1000}

agent:
  context:
    recent-messages-count: ${AGENT_RECENT_MESSAGES_COUNT:5}
    sliding-window-size: ${AGENT_SLIDING_WINDOW_SIZE:10}
  memory:
    long-term-update-interval: ${AGENT_LONG_TERM_UPDATE_INTERVAL:3}

mcp:
  server:
    url: ${MCP_SERVER_URL:http://localhost:8081}
  scheduler:
    url: ${MCP_SCHEDULER_URL:http://localhost:8082}

spring:
  datasource:
    url: jdbc:h2:file:./data/bookai
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
