anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:1000}

agent:
  context:
    recent-messages-count: ${AGENT_RECENT_MESSAGES_COUNT:5}
    sliding-window-size: ${AGENT_SLIDING_WINDOW_SIZE:10}
  memory:
    long-term-update-interval: ${AGENT_LONG_TERM_UPDATE_INTERVAL:3}

mcp:
  server:
    url: ${MCP_SERVER_URL:http://localhost:8081}
  scheduler:
    url: ${MCP_SCHEDULER_URL:http://localhost:8082}

rag:
  voyage-api-key: ${VOYAGE_API_KEY:}
  voyage-model: ${RAG_VOYAGE_MODEL:voyage-3-lite}
  embedding-dims: ${RAG_EMBEDDING_DIMS:512}
  batch-size: ${RAG_BATCH_SIZE:64}
  request-delay-ms: ${RAG_REQUEST_DELAY_MS:21000}
  fixed-chunk-size: ${RAG_FIXED_CHUNK_SIZE:600}
  fixed-chunk-overlap: ${RAG_FIXED_CHUNK_OVERLAP:100}
  index-dir: ${RAG_INDEX_DIR:./data/rag}
  top-k: ${RAG_TOP_K:5}
  max-tokens: ${RAG_MAX_TOKENS:2000}
  source-paths:
    - data/pdf/СП 22-2016.pdf
    - CLAUDE.md
    - data

spring:
  datasource:
    url: jdbc:h2:file:./data/bookai
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
